<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gym Slot Booking</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
  }

  .container {
    max-width: 800px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }

  th {
    background-color: #eee;
  }

  input, select {
    padding: 8px;
    margin: 5px 0;
    width: 100%;
    box-sizing: border-box;
  }

  button {
    padding: 10px 20px;
    background-color: #0288D1;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background-color: #0277BD;
  }

  #exportBtn {
    margin-top: 20px;
    background-color: #388E3C;
  }

  #exportBtn:hover {
    background-color: #2E7D32;
  }

  .status {
    margin-top: 10px;
    font-weight: bold;
  }
</style>
</head>
<body>

<h1>Gym Slot Booking System</h1>

<div class="container">
  <h2>Book a Slot</h2>
  <form id="bookingForm">
    <label for="name">Name:</label>
    <input type="text" id="name" required />

    <label for="contact">Contact Number:</label>
    <input type="text" id="contact" required />

    <label for="startTime">Start Time:</label>
    <input type="time" id="startTime" required />

    <label for="endTime">End Time:</label>
    <input type="time" id="endTime" required />

    <button type="submit">Book Slot</button>
  </form>
  <div class="status" id="statusMessage"></div>
</div>

<h2>Existing Bookings</h2>
<table id="bookingTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Contact</th>
      <th>Start Time</th>
      <th>End Time</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<button id="exportBtn">Export to CSV</button>

<script>
  // Initialize bookings from local storage or empty array
  let bookings = JSON.parse(localStorage.getItem('bookings')) || [];

  const form = document.getElementById('bookingForm');
  const statusMessage = document.getElementById('statusMessage');
  const tableBody = document.querySelector('#bookingTable tbody');

  // Function to render bookings in table
  function renderBookings() {
    tableBody.innerHTML = '';
    bookings.forEach(booking => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${booking.name}</td>
        <td>${booking.contact}</td>
        <td>${booking.startTime}</td>
        <td>${booking.endTime}</td>
      `;
      tableBody.appendChild(row);
    });
  }

  // Call render on page load
  renderBookings();

  // Function to check if slot is available
  function isSlotAvailable(startTime, endTime) {
    for (let b of bookings) {
      if (
        (startTime >= b.startTime && startTime < b.endTime) ||
        (endTime > b.startTime && endTime <= b.endTime) ||
        (startTime <= b.startTime && endTime >= b.endTime)
      ) {
        return false; // Slot overlaps
      }
    }
    return true;
  }

  // Handle form submission
  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;

    if (startTime >= endTime) {
      statusMessage.textContent = 'End time must be after start time.';
      return;
    }

    if (isSlotAvailable(startTime, endTime)) {
      const newBooking = { name, contact, startTime, endTime };
      bookings.push(newBooking);
      localStorage.setItem('bookings', JSON.stringify(bookings));
      renderBookings();
      statusMessage.textContent = 'Slot booked successfully!';
      form.reset();
    } else {
      statusMessage.textContent = 'Selected slot is already booked.';
    }
  });

  // Export bookings to CSV
  document.getElementById('exportBtn').addEventListener('click', function() {
    let csvContent = 'Name,Contact,Start Time,End Time\n';
    bookings.forEach(b => {
      csvContent += `${b.name},${b.contact},${b.startTime},${b.endTime}\n`;
    });
    const blob = new Blob([csvContent], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bookings.csv';
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
