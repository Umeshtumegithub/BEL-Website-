<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gym Booking Dashboard</title>
<!-- Google Fonts for better typography -->
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    color: #333;
  }

  /* Container for login or dashboard */
#container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

/* Login overlay styling */
#loginOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  animation: fadeIn 1s ease;
}

#loginBox {
  background: #fff;
  padding: 30px;
  border-radius: 10px;
  width: 300px;
  box-shadow: 0 8px 16px rgba(0,0,0,0.3);
  text-align: center;
  animation: slideDown 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideDown {
  from { transform: translateY(-50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Dashboard styles */
#dashboard {
  display: none; /* Hidden initially, shown after login */
  animation: fadeIn 1s ease;
}

/* Header styles */
h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #fff;
  text-shadow: 2px 2px 4px #000;
}

/* Buttons */
button {
  background-color: #0288D1;
  color: #fff;
  border: none;
  padding: 12px 24px;
  margin: 10px 0;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.3s, transform 0.2s;
}

button:hover {
  background-color: #0277BD;
  transform: scale(1.05);
}

/* Additional buttons (logout, back) styling for clarity */
#logoutBtn, #backBtn {
  background-color: #d32f2f; /* red for logout, dark for back */
}

#logoutBtn:hover, #backBtn:hover {
  background-color: #b71c1c;
}

/* Header and section styles */
h2 {
  margin-top: 30px;
  color: #fff;
  text-shadow: 1px 1px 3px #000;
}

/* Dashboard cards */
.dashboard {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  margin-top: 20px;
}

.card {
  background: rgba(255,255,255,0.9);
  padding: 20px;
  border-radius: 10px;
  width: 30%;
  min-width: 250px;
  margin: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: transform 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background-color: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
}

th {
  background-color: #f0f0f0;
  font-weight: bold;
}

/* Form styles */
form {
  background-color: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  max-width: 600px;
  margin: auto;
  margin-top: 20px;
  animation: fadeIn 1s ease;
}

form label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

form input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

#exportBtn {
  display: block;
  margin: 20px auto;
  background-color: #388E3C;
}

#exportBtn:hover {
  background-color: #2E7D32;
}

/* Animations for various elements */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>
<body>

<!-- Login Overlay -->
<div id="loginOverlay">
  <div id="loginBox">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="username">Username:</label>
      <input type="text" id="username" required />
      <label for="password">Password:</label>
      <input type="password" id="password" required />
      <button type="submit">Login</button>
    </form>
  </div>
</div>

<!-- Main Dashboard Container -->
<div id="container">
  <div id="dashboard">
    <h1>Gym Booking Dashboard</h1>

    <!-- Buttons for Logout and Back -->
    <div style="text-align:center; margin-bottom:10px;">
      <button id="logoutBtn">Logout</button>
      <button id="backBtn">Back</button>
    </div>

    <!-- Stats -->
    <div class="dashboard">
      <div class="card">
        <h2>Total Bookings</h2>
        <p id="totalBookings">0</p>
      </div>
      <div class="card">
        <h2>Training Types</h2>
        <ul id="trainingTypes"></ul>
      </div>
      <div class="card">
        <h2>Booked Slots</h2>
        <ul id="bookedSlots"></ul>
      </div>
    </div>

    <!-- Import CSV Data -->
    <div style="text-align:center; margin-top:20px;">
      <h3>Import Booking Data (CSV Format)</h3>
      <input type="file" id="csvFileInput" accept=".csv" />
      <button id="loadDataBtn">Load Data</button>
    </div>

    <!-- Book a Slot -->
    <div style="margin-top:30px;">
      <h2>Book a Slot</h2>
      <form id="bookingForm">
        <label>Name:</label>
        <input type="text" id="name" required />
        <label>Contact:</label>
        <input type="text" id="contact" required />
        <label>Training Type:</label>
        <select id="trainingType" required>
          <option value="Weightlifting">Weightlifting</option>
          <option value="Cardio">Cardio</option>
          <option value="Yoga">Yoga</option>
          <option value="Crossfit">Crossfit</option>
        </select>
        <label>Start Time:</label>
        <input type="time" id="startTime" required />
        <label>End Time:</label>
        <input type="time" id="endTime" required />
        <button type="submit">Book Slot</button>
      </form>
      <div class="status" id="statusMessage"></div>
    </div>

    <!-- Existing Bookings -->
    <h2>Existing Bookings</h2>
    <table id="bookingTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Contact</th>
          <th>Training Type</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- Export Button -->
    <button id="exportBtn">Export Bookings</button>
  </div>
</div>

<script>
  // User credentials for login
  const USER_CREDENTIALS = {
    username: "admin",
    password: "password"
  };

  // DOM elements
  const loginOverlay = document.getElementById('loginOverlay');
  const loginForm = document.getElementById('loginForm');
  const dashboardDiv = document.getElementById('dashboard');
  const logoutBtn = document.getElementById('logoutBtn');
  const backBtn = document.getElementById('backBtn');

  // Show login overlay initially
// Handle login
loginForm.addEventListener('submit', function(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (username === USER_CREDENTIALS.username && password === USER_CREDENTIALS.password) {
    // Hide login overlay
    loginOverlay.style.display = 'none';
    // Show dashboard
    dashboardDiv.style.display = 'block';
    // Save login state
    localStorage.setItem('loggedIn', 'true');
  } else {
    alert('Invalid credentials!');
  }
});

// Logout button
document.getElementById('logoutBtn').addEventListener('click', function() {
  // Show login overlay
  loginOverlay.style.display = 'flex';
  // Hide dashboard
  dashboardDiv.style.display = 'none';
  // Clear login state
  localStorage.removeItem('loggedIn');
});

// Back button
backBtn.addEventListener('click', function() {
  // For simplicity, let's just alert or reload previous page/state
  // or implement custom navigation if needed
  // Here, we'll just alert for demonstration
  alert('Back button clicked! Implement navigation as needed.');
});

// Load initial data
let bookings = [];

function loadInitialData() {
  // Example dummy data
  bookings = [
    { name: "John", contact: "1234567890", trainingType: "Weightlifting", startTime: "09:00", endTime: "10:00" },
    { name: "Alice", contact: "9876543210", trainingType: "Yoga", startTime: "10:30", endTime: "11:30" },
    { name: "Bob", contact: "5555555555", trainingType: "Cardio", startTime: "12:00", endTime: "13:00" }
  ];
  // Load from local storage if exists
  const stored = localStorage.getItem('bookings');
  if (stored) {
    bookings = JSON.parse(stored);
  }
}

// Initialize
loadInitialData();

const totalBookingsElem = document.getElementById('totalBookings');
const trainingTypesElem = document.getElementById('trainingTypes');
const bookedSlotsElem = document.getElementById('bookedSlots');

const tbody = document.querySelector('#bookingTable tbody');

function updateDashboard() {
  totalBookingsElem.textContent = bookings.length;

  const typesCount = {};
  bookings.forEach(b => {
    typesCount[b.trainingType] = (typesCount[b.trainingType] || 0) + 1;
  });
  trainingTypesElem.innerHTML = '';
  for (const [type, count] of Object.entries(typesCount)) {
    const li = document.createElement('li');
    li.textContent = `${type}: ${count}`;
    trainingTypesElem.appendChild(li);
  }

  bookedSlotsElem.innerHTML = '';
  bookings.forEach(b => {
    const li = document.createElement('li');
    li.textContent = `${b.startTime} - ${b.endTime} (${b.trainingType})`;
    bookedSlotsElem.appendChild(li);
  });
}

function renderBookings() {
  tbody.innerHTML = '';
  bookings.forEach(b => {
    const isBooked = !isSlotAvailable(b.startTime, b.endTime, b);
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${b.name}</td>
      <td>${b.contact}</td>
      <td>${b.trainingType}</td>
      <td>${b.startTime}</td>
      <td>${b.endTime}</td>
      <td style="color: ${isBooked ? 'red' : 'green'};">${isBooked ? 'Already Booked' : 'Available'}</td>
    `;
    tbody.appendChild(row);
  });
}

function isSlotAvailable(startTime, endTime, excludeBooking = null) {
  for (let b of bookings) {
    if (excludeBooking && b === excludeBooking) continue;
    if (
      (startTime >= b.startTime && startTime < b.endTime) ||
      (endTime > b.startTime && endTime <= b.endTime) ||
      (startTime <= b.startTime && endTime >= b.endTime)
    ) {
      return false;
    }
  }
  return true;
}

// Booking form handler
document.getElementById('bookingForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const contact = document.getElementById('contact').value.trim();
  const trainingType = document.getElementById('trainingType').value;
  const startTime = document.getElementById('startTime').value;
  const endTime = document.getElementById('endTime').value;

  if (startTime >= endTime) {
    document.getElementById('statusMessage').textContent = 'End time must be after start time.';
    return;
  }

  if (isSlotAvailable(startTime, endTime)) {
    const newBooking = { name, contact, trainingType, startTime, endTime };
    bookings.push(newBooking);
    localStorage.setItem('bookings', JSON.stringify(bookings));
    renderBookings();
    updateDashboard();
    document.getElementById('statusMessage').textContent = 'Slot booked successfully!';
    document.getElementById('bookingForm').reset();
  } else {
    document.getElementById('statusMessage').textContent = 'Selected slot is already booked.';
  }
});

// CSV import
document.getElementById('loadDataBtn').addEventListener('click', function() {
  const fileInput = document.getElementById('csvFileInput');
  const file = fileInput.files[0];
  if (!file) {
    alert('Please select a CSV file.');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    parseCSV(content);
    localStorage.setItem('bookings', JSON.stringify(bookings));
    renderBookings();
    updateDashboard();
  };
  reader.readAsText(file);
});

function parseCSV(content) {
  const lines = content.trim().split('\n');
  bookings = [];
  for (let i = 1; i < lines.length; i++) {
    const [name, contact, trainingType, startTime, endTime] = lines[i].split(',');
    bookings.push({ name, contact, trainingType, startTime, endTime });
  }
}

// Export data
document.getElementById('exportBtn').addEventListener('click', function() {
  let csvContent = 'Name,Contact,TrainingType,StartTime,EndTime\n';
  bookings.forEach(b => {
    csvContent += `${b.name},${b.contact},${b.trainingType},${b.startTime},${b.endTime}\n`;
  });
  const blob = new Blob([csvContent], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bookings_export.csv';
  a.click();
  URL.revokeObjectURL(url);
});

// Initialize dashboard
updateDashboard();
renderBookings();

// Optional: Check login state on page load
if (localStorage.getItem('loggedIn') === 'true') {
  loginOverlay.style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
} else {
  loginOverlay.style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}
</script>

</body>
</html>
