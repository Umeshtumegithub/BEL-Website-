<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gym Booking Dashboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
  }

  .dashboard {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
  }

  .card {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    width: 30%;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }

  .card h2 {
    margin-top: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }

  th {
    background-color: #eee;
  }

  input[type="file"] {
    margin-top: 10px;
  }

  button {
    padding: 10px 20px;
    margin-top: 10px;
    background-color: #0288D1;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background-color: #0277BD;
  }

  #exportBtn {
    background-color: #388E3C;
  }

  #exportBtn:hover {
    background-color: #2E7D32;
  }
</style>
</head>
<body>

<h1>Gym Booking Dashboard</h1>

<!-- Import Data -->
<div style="text-align:center; margin-top:20px;">
  <h3>Import Booking Data (CSV Format)</h3>
  <input type="file" id="csvFileInput" accept=".csv" />
  <button id="loadDataBtn">Load Data</button>
</div>

<!-- Dashboard Stats -->
<div class="dashboard">
  <div class="card">
    <h2>Total Bookings</h2>
    <p id="totalBookings">0</p>
  </div>
  <div class="card">
    <h2>Training Types</h2>
    <ul id="trainingTypes"></ul>
  </div>
  <div class="card">
    <h2>Booked Slots</h2>
    <ul id="bookedSlots"></ul>
  </div>
</div>

<!-- Book a Slot -->
<div style="margin-top:30px;">
  <h2>Book a Slot</h2>
  <form id="bookingForm">
    <label>Name:</label>
    <input type="text" id="name" required /><br/>
    <label>Contact:</label>
    <input type="text" id="contact" required /><br/>
    <label>Training Type:</label>
    <select id="trainingType" required>
      <option value="Weightlifting">Weightlifting</option>
      <option value="Cardio">Cardio</option>
      <option value="Yoga">Yoga</option>
      <option value="Crossfit">Crossfit</option>
    </select><br/>
    <label>Start Time:</label>
    <input type="time" id="startTime" required /><br/>
    <label>End Time:</label>
    <input type="time" id="endTime" required /><br/>
    <button type="submit">Book Slot</button>
  </form>
  <div class="status" id="statusMessage"></div>
</div>

<!-- Existing Bookings Table -->
<h2>Existing Bookings</h2>
<table id="bookingTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Contact</th>
      <th>Training Type</th>
      <th>Start Time</th>
      <th>End Time</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Export Button -->
<button id="exportBtn">Export Bookings</button>

<script>
  let bookings = [];

  // Load dummy data or from local storage
  function loadInitialData() {
    // Example dummy data
    bookings = [
      { name: "John", contact: "1234567890", trainingType: "Weightlifting", startTime: "09:00", endTime: "10:00" },
      { name: "Alice", contact: "9876543210", trainingType: "Yoga", startTime: "10:30", endTime: "11:30" },
      { name: "Bob", contact: "5555555555", trainingType: "Cardio", startTime: "12:00", endTime: "13:00" }
    ];
    // Load from local storage if exists
    const stored = localStorage.getItem('bookings');
    if (stored) {
      bookings = JSON.parse(stored);
    }
  }

  loadInitialData();

  const totalBookingsElem = document.getElementById('totalBookings');
  const trainingTypesElem = document.getElementById('trainingTypes');
  const bookedSlotsElem = document.getElementById('bookedSlots');

  const tbody = document.querySelector('#bookingTable tbody');

  function updateDashboard() {
    // Total bookings
    totalBookingsElem.textContent = bookings.length;

    // Training types
    const typesCount = {};
    bookings.forEach(b => {
      typesCount[b.trainingType] = (typesCount[b.trainingType] || 0) + 1;
    });
    trainingTypesElem.innerHTML = '';
    for (const [type, count] of Object.entries(typesCount)) {
      const li = document.createElement('li');
      li.textContent = `${type}: ${count}`;
      trainingTypesElem.appendChild(li);
    }

    // Booked slots
    bookedSlotsElem.innerHTML = '';
    bookings.forEach(b => {
      const li = document.createElement('li');
      li.textContent = `${b.startTime} - ${b.endTime} (${b.trainingType})`;
      bookedSlotsElem.appendChild(li);
    });
  }

  function renderBookings() {
    tbody.innerHTML = '';
    bookings.forEach(b => {
      const row = document.createElement('tr');
      // Check if slot is already booked
      const isBooked = !isSlotAvailable(b.startTime, b.endTime, b);
      row.innerHTML = `
        <td>${b.name}</td>
        <td>${b.contact}</td>
        <td>${b.trainingType}</td>
        <td>${b.startTime}</td>
        <td>${b.endTime}</td>
        <td style="color: ${isBooked ? 'red' : 'green'};">${isBooked ? 'Already Booked' : 'Available'}</td>
      `;
      tbody.appendChild(row);
    });
  }

  // Check if a slot overlaps with existing bookings
  function isSlotAvailable(startTime, endTime, excludeBooking = null) {
    for (let b of bookings) {
      if (excludeBooking && b === excludeBooking) continue;
      if (
        (startTime >= b.startTime && startTime < b.endTime) ||
        (endTime > b.startTime && endTime <= b.endTime) ||
        (startTime <= b.startTime && endTime >= b.endTime)
      ) {
        return false;
      }
    }
    return true;
  }

  // Handle booking form
 document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const trainingType = document.getElementById('trainingType').value;
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;

    if (startTime >= endTime) {
      document.getElementById('statusMessage').textContent = 'End time must be after start time.';
      return;
    }

    if (isSlotAvailable(startTime, endTime)) {
      const newBooking = { name, contact, trainingType, startTime, endTime };
      bookings.push(newBooking);
      localStorage.setItem('bookings', JSON.stringify(bookings));
      renderBookings();
      updateDashboard();
      document.getElementById('statusMessage').textContent = 'Slot booked successfully!';
      document.getElementById('bookingForm').reset();
    } else {
      document.getElementById('statusMessage').textContent = 'Selected slot is already booked.';
    }
  });

  // Load data from CSV file
 document.getElementById('loadDataBtn').addEventListener('click', function() {
    const fileInput = document.getElementById('csvFileInput');
    const file = fileInput.files[0];
    if (!file) {
      alert('Please select a CSV file.');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      const content = e.target.result;
      parseCSV(content);
      localStorage.setItem('bookings', JSON.stringify(bookings));
      renderBookings();
      updateDashboard();
    };
    reader.readAsText(file);
  });

  // Parse CSV content
 function parseCSV(content) {
    const lines = content.trim().split('\n');
    bookings = [];
    for (let i = 1; i < lines.length; i++) { // skip header
      const [name, contact, trainingType, startTime, endTime] = lines[i].split(',');
      bookings.push({ name, contact, trainingType, startTime, endTime });
    }
  }

  // Export bookings to CSV
 document.getElementById('exportBtn').addEventListener('click', function() {
    let csvContent = 'Name,Contact,TrainingType,StartTime,EndTime\n';
    bookings.forEach(b => {
      csvContent += `${b.name},${b.contact},${b.trainingType},${b.startTime},${b.endTime}\n`;
    });
    const blob = new Blob([csvContent], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bookings_export.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  // Initial rendering
  updateDashboard();
  renderBookings();

</script>

</body>
</html>
